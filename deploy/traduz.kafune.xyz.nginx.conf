# Instalar como /etc/nginx/sites-available/traduz.kafune.xyz.
# Depois, criar o link em sites-enabled e executar certbot --nginx.
server {
    listen 80;
    listen [::]:80;
    server_name traduz.kafune.xyz;

    client_max_body_size 10m;
    auth_basic "Traduz";
    auth_basic_user_file /etc/nginx/.htpasswd-traduz;

    location / {
        proxy_pass http://127.0.0.1:3010;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

{% extends "base.html" %}{% block title %}Glossário{% endblock %}{% block content %}<h1>Glossário</h1><form class="glossary-form" action="/glossary" method="post"><label>Termo original<input name="original" required></label><label>Tradução preferida<input name="translated" required></label><button>Salvar termo</button></form><ul class="terms">{% for (original, translated) in terms %}<li><span><b>{{ original }}</b> — {{ translated }}</span><form action="/glossary/{{ original }}" method="post"><button class="secondary">Apagar</button></form></li>{% endfor %}</ul>{% endblock %}
